[project]
name = "eco-news-summary"
version = "0.1.0"
description = "用本地 Ollama 模型以串流方式摘要生態保育新聞（期中作業）"
authors = [
    { name = "williamchen100", email = "203423661+williamchen100@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
eco-news-summary = "eco_news_summary:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
